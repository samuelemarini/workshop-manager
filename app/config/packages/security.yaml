security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    # L'amministratore eredita ufficio e tablet; l'ufficio può aprire anche il tablet.
    # Attenzione: la gerarchia vale per is_granted(), non per le query sui ruoli salvati
    # (es. UserRepository::findActiveByRole).
    role_hierarchy:
        ROLE_ADMIN: [ROLE_OFFICE]
        ROLE_OFFICE: [ROLE_TABLET]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/tablet, roles: ROLE_TABLET }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
